<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#0f3d22"/>
      <stop offset="100%" stop-color="#061508"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="55%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07c10"/>
    </linearGradient>
    <linearGradient id="grn" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e6b40"/>
      <stop offset="100%" stop-color="#0d4526"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Escudo: borde dorado -->
  <path d="M400 58 L722 166 L722 460 Q722 692 400 764 Q78 692 78 460 L78 166 Z"
        fill="url(#gold)" filter="url(#sh)"/>

  <!-- Escudo: relleno verde -->
  <path d="M400 82 L700 184 L700 458 Q700 668 400 736 Q100 668 100 458 L100 184 Z"
        fill="url(#grn)"/>

  <!-- Línea interior dorada sutil -->
  <path d="M400 102 L678 198 L678 456 Q678 646 400 712 Q122 646 122 456 L122 198 Z"
        fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.45"/>

  <!-- Caballo (cabeza de caballo heráldico) -->
  <text x="400" y="530"
        text-anchor="middle"
        font-family="FreeSerif"
        font-size="430"
        fill="rgba(238,238,238,0.93)">&#x265E;</text>

  <!-- Iniciales JC -->
  <text x="400" y="706"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="118"
        font-weight="bold"
        fill="url(#gold)"
        letter-spacing="14">JC</text>
</svg>
