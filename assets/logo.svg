<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0f3d22"/>
      <stop offset="100%" stop-color="#071a0f"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e6b40"/>
      <stop offset="100%" stop-color="#0f4527"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07c10"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="10"/>

  <!-- Shield gold border -->
  <path d="M200 36 L360 92 L360 228 Q360 344 200 384 Q40 344 40 228 L40 92 Z"
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Shield green fill -->
  <path d="M200 52 L344 102 L344 226 Q344 330 200 366 Q56 330 56 226 L56 102 Z"
        fill="url(#shieldGrad)"/>

  <!-- Shield inner gold border (thin) -->
  <path d="M200 64 L332 110 L332 225 Q332 320 200 354 Q68 320 68 225 L68 110 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Rearing Horse (white silhouette) -->
  <g transform="translate(200,195)" fill="rgba(238,238,238,0.93)">

    <!-- Body (main torso) -->
    <ellipse cx="10" cy="5" rx="52" ry="34" transform="rotate(-28 10 5)"/>

    <!-- Chest -->
    <ellipse cx="-33" cy="-26" rx="29" ry="20" transform="rotate(-52 -33 -26)"/>

    <!-- Neck -->
    <path d="M-20,-46 C-12,-70 0,-86 14,-90 C24,-93 30,-77 21,-61 C14,-49 1,-43 -20,-46Z"/>

    <!-- Head -->
    <path d="M14,-90 C22,-105 36,-109 44,-100 C52,-92 47,-77 36,-71 C25,-65 13,-73 14,-90Z"/>

    <!-- Ear -->
    <path d="M21,-100 C25,-115 32,-114 33,-104 C29,-97 23,-96 21,-100Z"/>

    <!-- Eye -->
    <circle cx="31" cy="-87" r="3.5" fill="rgba(20,60,30,0.85)"/>

    <!-- Nostril -->
    <ellipse cx="41" cy="-88" rx="5" ry="3.5" fill="rgba(160,160,160,0.45)" transform="rotate(-8 41 -88)"/>

    <!-- Mane -->
    <path d="M14,-89 C7,-74 3,-58 -8,-46" stroke="rgba(210,210,210,0.9)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M20,-85 C14,-68 11,-52 2,-40" stroke="rgba(210,210,210,0.7)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Front raised leg 1 -->
    <path d="M-47,-16 C-58,-6 -68,6 -63,22 C-57,34 -45,35 -37,23 C-29,12 -34,-7 -47,-16Z"/>
    <rect x="-67" y="20" width="12" height="30" rx="5" transform="rotate(18 -67 20)"/>
    <!-- Hoof 1 -->
    <ellipse cx="-61" cy="50" rx="9" ry="5" transform="rotate(18 -61 50)" fill="rgba(180,180,180,0.7)"/>

    <!-- Front raised leg 2 -->
    <path d="M-18,-38 C-26,-24 -29,-10 -22,4" stroke="rgba(238,238,238,0.93)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M-22,4 L-14,30" stroke="rgba(238,238,238,0.93)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Hoof 2 -->
    <ellipse cx="-13" cy="33" rx="8" ry="5" fill="rgba(180,180,180,0.7)"/>

    <!-- Hind leg 1 -->
    <path d="M15,40 C12,64 12,86 14,108" stroke="rgba(238,238,238,0.93)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Hoof 3 -->
    <ellipse cx="14" cy="111" rx="9" ry="5" fill="rgba(180,180,180,0.7)"/>

    <!-- Hind leg 2 -->
    <path d="M37,38 C40,62 42,85 46,107" stroke="rgba(238,238,238,0.93)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- Hoof 4 -->
    <ellipse cx="46" cy="110" rx="9" ry="5" fill="rgba(180,180,180,0.7)"/>

    <!-- Tail -->
    <path d="M58,6 C80,-10 90,14 76,48 C72,60 64,57 70,43 C76,28 73,8 58,6Z"/>
    <path d="M76,48 C72,62 65,70 59,64" stroke="rgba(220,220,220,0.75)" stroke-width="6" fill="none" stroke-linecap="round"/>

  </g>

  <!-- JC initials -->
  <text x="200" y="355"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="68"
        font-weight="bold"
        fill="url(#goldGrad)"
        filter="url(#glow)"
        letter-spacing="10">JC</text>

</svg>
